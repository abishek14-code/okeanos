<svg role="img" aria-label="Sensor acquisition connects to qualified baseline, pattern recognition, source analysis, exposure, risk and AND gating; commands return to main and drain valve drivers." viewBox="0 0 940 720" width="100%" style="max-height: 600px; margin-top: 12px;" xmlns="http://www.w3.org/2000/svg"><defs><marker id="workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91b9f2"></path></marker></defs><g stroke="#91b9f2" stroke-width="2" fill="none" marker-end="url(#workflow-arrow)"><path d="M225 82 V110"></path><path d="M225 172 V200"></path><path d="M420 231 H490"></path><path d="M685 262 V290"></path><path d="M685 352 V380"></path><path d="M685 442 V470"></path><path d="M685 532 V560"></path><path d="M490 591 H450 V621 H420"></path><path d="M225 590 V532"></path><path d="M225 470 V442"></path><path d="M30 411 H12 V141 H30"></path></g><g><rect x="30" y="20" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="46" y="45" fill="#e8e8e8" font-size="14" font-weight="600">1. Inlet → sensor chamber</text><text x="46" y="66" fill="#b3b3b3" font-size="11">TDS / pH / temperature; 1 Hz acquisition</text></g><g><rect x="30" y="110" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="46" y="135" fill="#e8e8e8" font-size="14" font-weight="600">2. Device packet + freshness evidence</text><text x="46" y="156" fill="#b3b3b3" font-size="11">Synthetic input; hardware output disconnected</text></g><g><rect x="30" y="200" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="46" y="225" fill="#e8e8e8" font-size="14" font-weight="600">3. Acquisition and sensor-fault gate</text><text x="46" y="246" fill="#b3b3b3" font-size="11">Values valid; regression cannot grant permission</text></g><g><rect x="490" y="200" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="506" y="225" fill="#e8e8e8" font-size="14" font-weight="600">4. Qualified 30-day baseline</text><text x="506" y="246" fill="#b3b3b3" font-size="11">Stable qualified data → source-specific baseline</text></g><g><rect x="490" y="290" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="506" y="315" fill="#e8e8e8" font-size="14" font-weight="600">5. Temporal patterns + uncertainty</text><text x="506" y="336" fill="#b3b3b3" font-size="11">ACCEPTABLE; full-interval checks</text></g><g><rect x="490" y="380" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="506" y="405" fill="#e8e8e8" font-size="14" font-weight="600">6. Source and joint anomaly analysis</text><text x="506" y="426" fill="#b3b3b3" font-size="11">MUNICIPAL; distance 0.03</text></g><g><rect x="490" y="470" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="506" y="495" fill="#e8e8e8" font-size="14" font-weight="600">7. Exposure / membrane model input</text><text x="506" y="516" fill="#b3b3b3" font-size="11">Observed + admitted + blocked stress; life unvalidated</text></g><g><rect x="490" y="560" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="506" y="585" fill="#e8e8e8" font-size="14" font-weight="600">8. Risk + recovery + AND permission</text><text x="506" y="606" fill="#b3b3b3" font-size="11">PROTECT; NORMAL</text></g><g><rect x="30" y="590" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="46" y="615" fill="#e8e8e8" font-size="14" font-weight="600">9. Main / drain command interlock</text><text x="46" y="636" fill="#b3b3b3" font-size="11">Main OPEN; drain CLOSED</text></g><g><rect x="30" y="470" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="46" y="495" fill="#e8e8e8" font-size="14" font-weight="600">10. ESP32 driver + local watchdog</text><text x="46" y="516" fill="#b3b3b3" font-size="11">Hard-limit veto; command expires after 2.5 seconds</text></g><g><rect x="30" y="380" width="390" height="62" rx="8" fill="#242424" stroke="#3a3a3a"></rect><text x="46" y="405" fill="#e8e8e8" font-size="14" font-weight="600">11. NC main valve → RO / drain branch</text><text x="46" y="426" fill="#b3b3b3" font-size="11">Physical flow evidence returns to acquisition</text></g><text x="30" y="699" fill="#929292" font-size="12">Faults veto permission immediately. Every decision feeds the recorder, replay and all six feature panels.</text></svg>